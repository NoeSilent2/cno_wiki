<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://kit.fontawesome.com/e46aa30d4b.js" crossorigin="anonymous"></script>
        <title>{% block title %}C&O Wiki{% endblock %}</title>
        <style>
            * { margin: 0; box-sizing: border-box; }
            body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;; background-color: #050505; color: #eee; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column;}
            header { border-bottom: 1px solid #333333; padding: 0; }
            nav {max-width: 1200px; margin: 0 auto; display: flex; align-items: center; padding: 0rem 0.5rem 0.5rem; gap: 2rem; flex-wrap:wrap;}
            a { color: #eee; text-decoration: none; font-weight: bold; }
            a:hover { text-decoration: underline #eee; }
            .logo { font-size: 1.25rem; font-weight: 600; color: #eee; text-decoration: none; margin:0px 10px;}
            .nav-links { display: flex; margin-left: auto;}
            .nav-links a { text-decoration: none; color: #888888; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.875rem; font-weight: 500; }
            .nav-links a:hover { color: #eee; background-color: #111111; }
            .dropdown {overflow: hidden;}
            .dropdown .dropbtn {border:none; outline: none; text-decoration:none; color: #888; background-color: #050505; padding: 0.5rem 1rem; border-radius: 6px 6px 0px 0px; font-size: 0.875rem; font-weight: 500; font-family: inherit; margin: 0;}
            .dropdown:hover .dropbtn { color:#eee; background-color: #111}
            .dropdown-content {display: none; position:absolute; min-width:120px; z-index:1; background-color: #111; border-radius: 0px 6px 6px 6px;}
            .dropdown-content a {float: none; padding: 12px 16px; display:block; text-align:left;}
            .dropdown-content a:hover {background-color: #333;}
            .dropdown:hover .dropdown-content {display: block;}
            main { max-width: 1200px; flex: 1; width: 90%; margin: 2rem auto; padding: 2rem 2rem; display: flex; flex-direction: column; text-align: left; border-radius: 8px; border: 1px solid #333333; }
            h1 { font-size: 3rem; font-weight: 700; margin-bottom: 1rem; color: #eee }
            h2 { font-size: 2rem; font-weight: normal; display: block; border-bottom: 1px solid #333333; margin-bottom: 1rem; }
            .roundy {border-radius:10px;}
            .infobox {box-sizing:border-box;float:right;width:400px;max-width:50%;}
            form input {background:#111; color:#eee; border-radius:6px; padding:4px;}
            form button {background:#333; color:#eee; border-radius:6px; padding:4px; cursor:pointer;}
            .gnn {background:#0a0a0c; border:2px solid #333; border-top:0; border-bottom:0; border-radius:0.5rem;}
            .gnn-item {display:inline-flex; margin-right:30px; font-size:0.9rem; color:#aaa;}
            .gnn-item:before {content:"•"; margin-right:30px; opacity:0.7; color:#fff;}
            #gnn-scroller {animation:gnn-scroll 240s linear infinite;}
            @keyframes gnn-scroll {
                from {transform:translateX(0);}
                to {transform:translateX(-50%);}
            }
        </style>
        {% block extra_head %}{% endblock %}
    </head>
    <body>
        <header id="versions" vmoves="1.0.4" vabilities="1.0.2">
            <nav style="padding:0rem 0.5rem; height:32px; gap:8px; margin:0.5rem auto;">
                <div class="gnn" style="width:60px; height:100%; display:flex; justify-content:center; align-items:center;">
                    <p style="letter-spacing:2px; font-family:'Comic Sans MS', 'Comic Sans', 'Comic Neue', 'Comic Sans Fallback', 'Balsamiq Sans', 'Patrick Hand', 'Architects Daughter', 'Chalkboard SE', cursive !important">
                        GNN
                    </p>
                </div>
                <div class="gnn" style="height:100%; flex:1; display:flex; align-items:stretch; overflow:hidden;">
                    <div id="gnn-scroller" style="display:flex; white-space:nowrap; will-change:transform; align-items:center;">
                        <script>
                            document.addEventListener('DOMContentLoaded', () => {
                                const scroller = document.querySelector('div#gnn-scroller')
                                if (scroller) {
                                    let news = [
                                        "Niche micro-celebrity Gary has created the 'Gary News Network'.",
                                        "JUST IN: The Main Page has received a desperately needed shipment of Flexible UI Elements.",
                                        "Website Admin overheard talking about introducing non-native Wobbling Cats. Public advised to stay alert.",
                                        "Local residents haven't raised $3,000 for the 'Learned-By' Foundation, a subsidiary of the Moves Page.",
                                        "New traffic reforms have lead to a 63% increase in Species URL Directions.",
                                        "Compression expert claims that withholding 'Learned-By' funding from Mega's and Regional Biases will reduce government spending by 8%.",
                                        "Protests have forced the Website Admin to double the maximum search results.",
                                        "'Cobblemon & Origins Wiki'- a new YouTube creator- has recently been making waves with his debut video 'github basics - how to contribute'.",
                                        "An influx of Geebles has forced the C&O Police Department to reduce contrast city-wide.",
                                        "Sightings of notorious vandal 'duder65' have been increasing. Citizens advised to throw rotten produce at him.",
                                        "Scientists are still struggling to cure the 'Spawn-Condition' Virus. Progress is slow, but steady, renowned Virologist NoeSilent says on the matter.",
                                        "Local entrepreneur Henry has stated that extending the Battle Menu to include Held Items was a failure.",
                                        "The nation-wide phenomenon, Gary, has recently graduated with a degree in Time Zones and 3D Modeling.",
                                        "Police found known drug-lord Thundurus in the Bronx late last night, missing both legs.",
                                        "Secretive government technology- 'The Datascraper'- has been made less secret by recent Freedom of Information requests.",
                                        "New Charity focusing on Browser-Caching Awareness has been increasing in popularity.",
                                        "Female-only Pokemon affirmed through new legislation, misgendering them 95% less.",
                                        "Police reforms have allowed previously oppressed Female Variants to be seen in public again.",
                                        "New Tournament Director icarus_05 pressuring news groups into being more verbose.",
                                        "Datapack creator 'Lasercraft32' found grieving over the death of Obyless, national day of mourning being planned by The Meowl Committee.",
                                        "Further Variant-Reforms have given national visibility to Pokemon of color through the new 'Color-Variant' button.",
                                        "A medical breakthrough in Backface-Culling results in the complete eradication of the disease. Shiny Fakemon organize events to celebrate this milestone.",
                                        "Oricorio's across the world left shocked at the recent decision to recognize Baile as the default Dance Style.",
                                        "Local strip-club owner found guilty of rat-related crimes. Reporters left too stunned to describe in greater detail.",
                                        "The rapid appointment of shield2550, jackiboi23, and icarus_05 have sent waves through neighboring counties.",
                                        "DRAMA: Government official allegedly caused the C&O YouTube Channel to be set to 'Kids Only' after logging in from the UK.",
                                        "Education Programs have been receiving numerous delays due to recent Government Contracts to build a really cool statue.",
                                        "Rumors that a favorite Town Representative will resign causes record sadness levels.",
                                        "Astronauts say that the Moon is real, but citizens are suspicious given the continued delays on the End Update.",
                                        "JUST IN: Owner of C&O found to have put ANOTHER AI Generated mod in the modpack. It is promptly removed for causing multiple known issues.",
                                        "ADVISORY: Smoke from the forest fires in Canada is making my throat hurt. It's really uncomfortable.",
                                        "BREAKTHROUGH: The violent pooping disease found to be caused by pooping violently. Doctors left stunned.",
                                        "Neighborhood watch reports the appearance of a Goblin, who has been catching Pokemon as soon as they appear and babbling nonsense.",
                                        "Editorial: Why you should worship Bunger, and why Meowl isn't the same thing.",
                                        "UPCOMING: National day of remembrance for the Flabebe Massacre.",
                                        "C&O Developers caught playing Palworld instead of working on the update. Nobody is surprised.",
                                        "'Haha, trust us guys, we're working on the update' C&O Owner 'duder65' said, while clearly playing Beetleball Ranked alone.",
                                        "Recent Demo for game 'Beetleball' has already been nominated for every award, and is expected to win Game of the Year despite not being released yet."
                                    ]
                                    news = news.sort(() => Math.random() - 0.5);
                                    news = [...news, ...news];
                                    news.forEach(entry => {
                                        const item = document.createElement('p')
                                        item.className = 'gnn-item';
                                        item.textContent = entry;
                                        scroller.appendChild(item);
                                    })
                                }
                            })
                        </script>
                    </div>
                </div>
            </nav>
            <nav>
                <a href="/" class="logo">C&O Wiki</a>
                <form method="get" action="{{ url_for('search_database') }}">
                    <input type="text" name="q" placeholder="Enter species or move name...">
                    <button type="submit"><i style="background:transparent" class="fa fa-search"></i></button>
                </form>
                <div class="nav-links">
                    <div class="dropdown">
                        <button class="dropbtn">
                            <a href="/origins" style="padding:0px">Game</a>
                        </button>
                        <div class="dropdown-content">
                            <a href="https://challonge.com/communities/CNO">Tournaments</a>
                            <a href="https://www.curseforge.com/minecraft/modpacks/cobblemon-and-origins">Modpack</a>
                            <a href="/credits">Credits</a>
                        </div>
                    </div>
                    <div class="dropdown">
                        <button class="dropbtn">
                            <a href="https://www.curseforge.com/minecraft/modpacks/cobblemon-and-origins" style="padding:0px">Server</a>
                        </button>
                        <div class="dropdown-content">
                            <a href="/staff">Staff</a>
                            <a href="https://discord.gg/hZ3QReRAcu">Discord</a>
                            <a href="http://67.189.184.7:25566/">Bluemap</a>
                            <a href="https://github.com/NoeSilent2/cno_wiki">GitHub</a>
                            <a href="https://challonge.com/communities/CNO">Challonge</a>
                        </div>
                    </div>
                    <div class="dropdown">
                        <button class="dropbtn">
                            <a href="/species" style="padding:0px">Pokemon</a>
                        </button>
                        <div class="dropdown-content">
                            <a href="/species">All Species</a>
                            <a href="/fakemon">Fakemon</a>
                            <a href="/fakeforms">Fakeforms</a>
                            <a href="/fossilmons">Fossilmons</a>
                            <a href="/species/random">Random Species</a>
                        </div>
                    </div>
                    <div class="dropdown">
                        <button class="dropbtn">
                            <a href="/moves" style="padding:0px">Battle</a>
                        </button>
                        <div class="dropdown-content">
                            <a href="/cmoves">New Moves</a>
                            <a href="/moves">All Moves</a>
                            <a href="/dmoves">Default Moves</a>
                            <a href="/items">Held Items</a>
                        </div>
                    </div>
                </div>
            </nav>
        </header>
        {% block body %}

        {% endblock %}
    </body>
</html>
